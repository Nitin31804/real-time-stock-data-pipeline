name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f dashboard/requirements.txt ]; then pip install -r dashboard/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        flake8 dashboard/ producer/ spark/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 dashboard/ producer/ spark/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
