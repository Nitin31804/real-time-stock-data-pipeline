services:

  # ─── INFRASTRUCTURE ────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181 30"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 24
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stock_db}"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrations:
    image: flyway/flyway:10-alpine
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stock_db}
      - -user=${POSTGRES_USER:-postgres}
      - -password=${POSTGRES_PASSWORD:-postgres}
      - -connectRetries=60
      - migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stock-network

  # ─── APPLICATION SERVICES ──────────────────────────────────────────────────

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: stock-producer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-stock.raw-ticks.v1}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      DATA_MODE: ${DATA_MODE:-simulation}
      STOCK_SYMBOLS: ${STOCK_SYMBOLS:-AAPL,GOOGL,MSFT,AMZN,TSLA,NVDA,META,NFLX,AMD,INTC,JPM,V,WMT,JNJ,PG,MA,UNH,HD,BAC,DIS}
      TICK_INTERVAL_MS: ${TICK_INTERVAL_MS:-500}
      METRICS_PORT: "9101"
    ports:
      - "9101:9101"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - stock-network

  spark-job:
    build:
      context: ./spark_processor
      dockerfile: Dockerfile
    container_name: spark-streaming-job
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-stock.raw-ticks.v1}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stock_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-stock_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CANDLE_WINDOW: "1 minute"
      WATERMARK_DELAY: "30 seconds"
      TRIGGER_INTERVAL: "2 seconds"
      METRICS_PORT: "9102"
    ports:
      - "9102:9102"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - stock-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: stock-dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-stock_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      STOCK_SYMBOLS: ${STOCK_SYMBOLS:-AAPL,GOOGL,MSFT,AMZN,TSLA,NVDA,META,NFLX,AMD,INTC,JPM,V,WMT,JNJ,PG,MA,UNH,HD,BAC,DIS}
      DATA_MODE: ${DATA_MODE:-simulation}
      KAFKA_HOST: kafka
      KAFKA_PORT: "9092"
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - stock-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - stock-network

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - producer
      - spark-job
      - dashboard
      - kafka-exporter
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
