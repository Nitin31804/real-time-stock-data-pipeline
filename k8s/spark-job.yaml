apiVersion: batch/v1
kind: Job
metadata:
  name: stock-spark-streaming
spec:
  template:
    spec:
      containers:
      - name: spark-job
        image: your-docker-repo/stock-spark-job:latest
        envFrom:
        - secretRef:
            name: db-secrets
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-cluster-service:9092"
      restartPolicy: OnFailure
