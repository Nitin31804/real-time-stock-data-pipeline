global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: producer
    static_configs:
      - targets: ["producer:9101"]

  - job_name: spark-processor
    static_configs:
      - targets: ["spark-job:9102"]

  - job_name: dashboard
    metrics_path: /metrics
    static_configs:
      - targets: ["dashboard:5000"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
